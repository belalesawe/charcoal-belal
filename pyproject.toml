[project]
name = "charcoal-cli"
version = "0.1.0"
description = "CLI for managing stacked branches"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "pydantic>=2.0.0",
]

[project.scripts]
charcoal = "charcoal_cli.cli:main"
gt = "charcoal_cli.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-xdist>=3.0.0",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"
